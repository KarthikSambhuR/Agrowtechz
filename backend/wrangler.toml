name = "agrowtechz-api"
main = "src/index.ts"
compatibility_date = "2024-03-27"

[vars]
NVIDIA_MODEL = "moonshotai/kimi-k2-instruct"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
CORS_ORIGINS = "https://agrowtechz.vercel.app"

# Note: NVIDIA_API_KEY should be added as a secret using `wrangler secret put NVIDIA_API_KEY`
# Or for local development, add to .dev.vars
